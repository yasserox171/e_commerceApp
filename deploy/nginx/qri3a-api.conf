# nginx alternative to deploy/caddy/Caddyfile.
#
# Use this only if nginx already runs on the box. Caddy is the default because
# it handles certificates by itself; with nginx you issue them separately:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo cp deploy/nginx/qri3a-api.conf /etc/nginx/sites-available/qri3a-api
#   sudo ln -s /etc/nginx/sites-available/qri3a-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.your-domain.ma
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot rewrites this file to add the ssl_certificate lines and the :443
# server block.

upstream qri3a_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.ma;

    # certbot replaces this with a redirect to https once the cert exists.
    location / {
        proxy_pass http://qri3a_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A card payment can sit on the gateway's 3-D Secure step for a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # Product images can be large; the JSON bodies never are.
    client_max_body_size 2m;

    access_log /var/log/nginx/qri3a-api.access.log;
    error_log  /var/log/nginx/qri3a-api.error.log;
}
