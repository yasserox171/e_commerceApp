# Use this when nginx ALREADY serves other sites on ports 80/443.
#
# It does not need a free port. nginx routes by the Host header, so this vhost
# shares 80 and 443 with every site already there — they coexist as long as no
# other server block claims 9ri3a.centrefocus.ma. Check that first:
#
#   grep -rn "server_name" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null
#
# Install:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo cp deploy/nginx/qri3a-api.conf /etc/nginx/sites-available/qri3a-api
#   sudo ln -s /etc/nginx/sites-available/qri3a-api /etc/nginx/sites-enabled/
#   sudo nginx -t                       # MUST pass before you reload
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d 9ri3a.centrefocus.ma
#
# certbot edits this file in place to add the ssl_certificate lines and the
# :443 server block, and leaves the other sites' certificates alone.
#
# Two things that break an existing nginx if you are careless:
#   * Never add `default_server` here — it would steal every unmatched request
#     from whatever site currently holds it.
#   * The upstream name below is deliberately specific. Two upstreams sharing a
#     name is a config error that takes the whole server down on reload, which
#     is why `nginx -t` above is not optional.

upstream qri3a_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 9ri3a.centrefocus.ma;

    # certbot replaces this with a redirect to https once the cert exists.
    location / {
        proxy_pass http://qri3a_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A card payment can sit on the gateway's 3-D Secure step for a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # Product images can be large; the JSON bodies never are.
    client_max_body_size 2m;

    access_log /var/log/nginx/qri3a-api.access.log;
    error_log  /var/log/nginx/qri3a-api.error.log;
}
