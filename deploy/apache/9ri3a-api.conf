# Use this when Apache ALREADY serves other sites on ports 80/443.
#
# Like nginx, Apache routes by the Host header, so this virtual host shares 80
# and 443 with everything already running — no free port needed. Check that no
# other vhost already claims the name:
#
#   sudo apache2ctl -S 2>&1 | grep -i 9ri3a
#
# Install:
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache/9ri3a-api.conf /etc/apache2/sites-available/
#   sudo a2ensite 9ri3a-api
#   sudo apache2ctl configtest          # MUST say "Syntax OK" before reloading
#   sudo systemctl reload apache2
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d 9ri3a.centrefocus.ma
#
# certbot adds the :443 vhost and the certificate lines, and leaves the other
# sites untouched.
#
# Never give this vhost `_default_` or make it the first-listed one unless it
# already is — Apache serves the first matching vhost for an unmatched Host,
# and taking that role from another site breaks it silently.

<VirtualHost *:80>
    ServerName 9ri3a.centrefocus.ma

    # certbot replaces this with a redirect to https once the certificate exists.
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        / http://127.0.0.1:4000/ connectiontimeout=10 timeout=120
    ProxyPassReverse / http://127.0.0.1:4000/

    # Express runs with `trust proxy`, and the rate limiter on /auth depends on
    # the real client IP arriving here.
    RequestHeader set X-Real-IP        %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "http"

    # A card payment can sit on the gateway's 3-D Secure step for a while; the
    # 120s timeout above is what keeps the callback from being cut off.

    ErrorLog  ${APACHE_LOG_DIR}/9ri3a-api.error.log
    CustomLog ${APACHE_LOG_DIR}/9ri3a-api.access.log combined
</VirtualHost>
