name: Publish APK Release

# Turns the artifacts of a finished "Build Android APK" run into a GitHub
# Release, so the APKs get a plain download link.
#
# Why this exists: workflow artifacts are zipped, expire after 30 days, require
# being signed in, and — the reason it matters here — the GitHub mobile app does
# not show them at all. A Release asset is a direct link that installs with one
# tap from a phone browser.
#
# Run it from the Actions tab, or:
#   gh workflow run publish-apk-release.yml -f run_id=<the build run id>

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          The "Build Android APK" run whose APKs to publish. Copy it from that
          run's URL (…/actions/runs/THIS_NUMBER). Leave blank for the latest
          successful build.
        type: string
        required: false
      tag:
        description: Release tag. Leave blank to derive one from the run number.
        type: string
        required: false
      notes:
        description: Extra note shown at the top of the release body.
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Pick the build run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            RUN_ID="$REQUESTED"
          else
            RUN_ID=$(gh run list --workflow build-apk.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "No successful Build Android APK run to publish." >&2
              exit 1
            fi
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts from run $RUN_ID"

          # The APK carries the commit it was built from; record it so the
          # release points at real source rather than at whatever HEAD is now.
          SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "number=$(gh run view "$RUN_ID" --json number --jq '.number')" >> "$GITHUB_OUTPUT"

      - name: Download the APKs from that run
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check what came back
        id: files
        run: |
          set -euo pipefail
          find apks -type f | sort
          COUNT=$(find apks -name '*.apk' -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "That run has no .apk artifacts (expired, or it failed)." >&2
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA_NOTES: ${{ github.event.inputs.notes }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-apk-build-${{ steps.pick.outputs.number }}}"
          SHA="${{ steps.pick.outputs.sha }}"

          {
            [ -n "$EXTRA_NOTES" ] && printf '%s\n\n' "$EXTRA_NOTES"
            cat <<'BODY'
## التثبيت

1. اضغط على ملف `.apk` تحت **Assets** — يتحمّل مباشرة.
2. افتح الملف بعد التحميل.
3. Android سيطلب **السماح بالتثبيت من هذا المصدر** — وافق.

التطبيقان يُثبّتان جنبًا إلى جنب (`ma.qri3a.wholesale` و `ma.qri3a.express`).

| الملف | التطبيق |
|---|---|
| `9ri3a-wholesale-…apk` | **9ri3a** — الجملة، أسعار حسب الكمية |
| `9ri3a-dropshipping-…apk` | **9ri3a espress** — التجزئة، دفع بالبطاقة |

## ملاحظات

- موقّعة بمفتاح debug: تُثبَّت للاختبار، ولا تصلح للنشر على Google Play.
- عنوان الـ API مدمج وقت البناء. إذا لم يكن الخادم متاحًا من الهاتف، ستعمل كل
  الشاشات لكن الكتالوج سيعرض «تعذر تحميل المنتجات». أعد التشغيل من
  **Build Android APK** مع `api_url` الصحيح.
BODY
          } > notes.md

          echo "Tag: $TAG · commit: $SHA"
          gh release create "$TAG" apks/*.apk \
            --title "APK build ${{ steps.pick.outputs.number }}" \
            --notes-file notes.md \
            --target "$SHA" \
            --prerelease

          {
            echo "### Release published"
            echo ""
            echo "**https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}**"
            echo ""
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "- [\(.name)](\(.url)) — \((.size/1048576*10|floor)/10) MB"'
          } >> "$GITHUB_STEP_SUMMARY"
